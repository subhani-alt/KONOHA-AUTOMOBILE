version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: valence_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: valence_server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/valence_automobili
      - JWT_SECRET=valence_hypercar_secret_key_2026
    depends_on:
      - mongodb

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: valence_client
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo_data:
